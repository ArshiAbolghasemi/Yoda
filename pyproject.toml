[project]
name = "yoda"
version = "0.1.0"
description = "TailRiskFlow: Tail-VoI gated, DRO-CVaR portfolio allocation research stack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "httpx==0.28.1",
    "dvc[s3]>=3.67.1",
    "dynaconf>=3.3.5",
    "gymnasium>=1.3.0",
    "jev>=0.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.1",
    "openai==3.16.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "tenacity>=9.1.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "typesafe-sdk>=0.7.1",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
# Torch build selection. Pick exactly one; they are mutually exclusive.
#   uv sync --extra cu132      (Linux/Windows CUDA 13.2)
#   uv sync --extra cu130      (Linux/Windows CUDA 13.0)
#   uv sync --extra cu129      (Linux/Windows CUDA 12.9, research only)
#   uv sync --extra cpu        (CPU-only wheels)
# Serving needs one of the two CUDA 13 channels - they are the only ones that
# carry vLLM. cu126/cu128/cu129 are research-only builds. With no extra, torch
# resolves from PyPI (CUDA 13 on Linux, MPS/CPU on macOS).
cpu = ["torch>=2.8.0"]
cu126 = ["torch>=2.8.0"]
cu128 = ["torch>=2.8.0"]
cu129 = ["torch>=2.8.0"]
# vLLM rides with the CUDA 13 channels and nowhere else: its PyPI wheel links
# libcudart.so.13, so it runs only against a CUDA 13 torch. The cu126/cu128/
# cu129 channels ship libcudart.so.12, so installing vLLM beside them resolves
# cleanly and then dies on import. Scoping it here makes that unrepresentable.
# No macOS wheels either - nvidia-cudnn-frontend is linux/windows only.
cu130 = [
    "torch>=2.8.0",
    "vllm==0.29.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
cu132 = [
    "torch>=2.8.0",
    "vllm==0.29.0; sys_platform == 'linux' or sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.8",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu129" },
        { extra = "cu130" },
        { extra = "cu132" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
# CUDA wheels exist for Linux/Windows only; macOS always falls back to PyPI.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The agent prompts are stored verbatim; reflowing them would change what the
# model is asked, and the prompt text is part of the cache key.
"yoda/specialists/prompts/agents.py" = ["E501"]
