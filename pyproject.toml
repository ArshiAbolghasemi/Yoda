[project]
name = "yoda"
version = "0.1.0"
description = "TailRiskFlow: Tail-VoI gated, DRO-CVaR portfolio allocation research stack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "httpx==0.28.1",
    "dvc[s3]>=3.67.1",
    "dynaconf>=3.3.5",
    "gymnasium>=1.3.0",
    "jev>=0.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.1",
    "openai==3.16.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "tenacity>=9.1.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "typesafe-sdk>=0.7.1",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
# Torch build selection. Pick exactly one; they are mutually exclusive.
#   uv sync --extra cu129      (CUDA 12.9 - serves, and runs on a 12.8 driver)
#   uv sync --extra cu130      (CUDA 13.0 - serves, needs driver r580+)
#   uv sync --extra cu126      (CUDA 12.6, research only)
#   uv sync --extra cu128      (CUDA 12.8, research only)
#   uv sync --extra cu132      (CUDA 13.2, research only)
#   uv sync --extra cpu        (CPU-only wheels)
#
# vLLM publishes one wheel per CUDA major/minor at wheels.vllm.ai, and only two
# of them exist: cu129 and cu130. PyPI carries the cu130 build alone, which is
# why pairing plain `pip install vllm` with a CUDA 12 torch fails on
# libcudart.so.13. Each serving extra therefore pulls vLLM from its own index.
#
#   cu129  vllm 0.29.0+cu129, torch 2.13.0+cu129   <- CUDA 12 hosts
#   cu130  vllm 0.29.0+cu130, torch 2.13.0+cu130   <- CUDA 13 hosts
#   cu126 / cu128 / cu132  no vLLM build published - research only
#
# torchaudio/torchvision/torchcodec ride along because vLLM pulls them and each
# asserts an exact CUDA match against torch at import; all are pinned to the
# matching index below so they cannot disagree.
cpu = ["torch>=2.8.0"]
cu126 = ["torch>=2.8.0"]
cu128 = ["torch>=2.8.0"]
cu129 = [
    "torch>=2.8.0",
    "torchaudio; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchcodec; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision; sys_platform == 'linux' or sys_platform == 'win32'",
    "vllm==0.29.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
cu130 = [
    "torch>=2.8.0",
    "torchaudio; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchcodec; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision; sys_platform == 'linux' or sys_platform == 'win32'",
    "vllm==0.29.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
# cu132 publishes no torchaudio, which vLLM requires, and no vLLM build of its
# own: serving from it dies with "PyTorch has CUDA version 13.2 whereas
# TorchAudio has CUDA version 13.0".
cu132 = ["torch>=2.8.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.8",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu129" },
        { extra = "cu130" },
        { extra = "cu132" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# vLLM's own per-CUDA wheel index. PyPI has the cu130 build only.
[[tool.uv.index]]
name = "vllm-cu129"
url = "https://wheels.vllm.ai/0.29.0/cu129/"
explicit = true

[[tool.uv.index]]
name = "vllm-cu130"
url = "https://wheels.vllm.ai/0.29.0/cu130/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
# CUDA wheels exist for Linux/Windows only; macOS always falls back to PyPI.
# torchaudio and friends must ride the same index as torch: left to PyPI they
# track whatever CUDA PyTorch currently defaults to (13.0) and silently
# mismatch any non-default torch.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu132", extra = "cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchcodec = [
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
vllm = [
    { index = "vllm-cu129", extra = "cu129", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "vllm-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The agent prompts are stored verbatim; reflowing them would change what the
# model is asked, and the prompt text is part of the cache key.
"yoda/specialists/prompts/agents.py" = ["E501"]
