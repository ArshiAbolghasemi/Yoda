[project]
name = "yoda"
version = "0.1.0"
description = "TailRiskFlow: Tail-VoI gated, DRO-CVaR portfolio allocation research stack"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "dvc[s3]>=3.67.1",
    "dynaconf>=3.3.5",
    "gymnasium>=1.3.0",
    "jev>=0.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "stable-baselines3>=2.9.0",
    "tenacity>=9.1.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "typesafe-sdk>=0.7.1",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
# Torch build selection. Pick exactly one; they are mutually exclusive.
#   uv sync --extra cu128      (Linux/Windows CUDA 12.8)
#   uv sync --extra cpu        (CPU-only wheels)
# With no extra, torch resolves from PyPI (the default wheel for the platform:
# CUDA on Linux, MPS/CPU on macOS).
cpu = ["torch>=2.8.0"]
cu126 = ["torch>=2.8.0"]
cu128 = ["torch>=2.8.0"]
cu130 = ["torch>=2.8.0"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.8",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu126" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
# CUDA wheels exist for Linux/Windows only; macOS always falls back to PyPI.
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The agent prompts are stored verbatim; reflowing them would change what the
# model is asked, and the prompt text is part of the cache key.
"yoda/specialists/prompts/agents.py" = ["E501"]
